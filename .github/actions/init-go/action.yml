name: 'Setup Go with cache'
description: 'Setup Go and configure modules cache'
inputs:
  go-version:
    description: 'Go version'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Go ${{ inputs.go-version }}
      uses: actions/setup-go@v5
      with:
        cache: true
        go-version: ${{ inputs.go-version }}

    - name: Prime Go cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          C:\Users\runneradmin\go\pkg\mod
        key: ${{ runner.os }}-go-${{ inputs.go-version }}-${{ hashFiles('go.mod') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ inputs.go-version }}-
          ${{ runner.os }}-go-
